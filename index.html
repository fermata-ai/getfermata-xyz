<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Fermata moved to getfermata.app. Every address on getfermata.xyz goes to the same path there, with
       its query and fragment: installed apps finish a sign-in at getfermata.xyz/signed-in/?…, and those
       one-time details have to arrive intact. No analytics, no referrer. -->
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Fermata has moved to getfermata.app</title>
  <script>
    location.replace("https://getfermata.app" + location.pathname + location.search + location.hash);
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=https://getfermata.app/"></noscript>
</head>
<body>
  <p>Fermata has moved to <a href="https://getfermata.app/">getfermata.app</a>.</p>
</body>
</html>
